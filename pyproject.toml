[project]
name = "pyhusk"
version = "0.1.0"
description = "Minimal Docker images for FastAPI monorepos"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Topic :: Software Development :: Build Tools",
    "Intended Audience :: Developers",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://a-elhaag.github.io/pyhusk/"
Documentation = "https://a-elhaag.github.io/pyhusk/docs/"
Source = "https://github.com/a-elhaag/pyhusk"

[project.scripts]
pyhusk = "pyhusk.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]
docs = ["mkdocs-material>=9.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyhusk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: requires a running Docker daemon"]
