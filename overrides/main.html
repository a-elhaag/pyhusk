{% extends "base.html" %}

{% block content %}
<div class="pyhusk-page-header">
  <div class="pyhusk-action-bar">
    <button id="copy-markdown-btn" class="copy-markdown-btn" aria-label="Copy page as Markdown">
      <svg class="copy-icon" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
        <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
      </svg>
      <svg class="check-icon" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
      <span class="btn-text">Copy Markdown</span>
    </button>
    <a href="https://github.com/a-elhaag/pyhusk" target="_blank" rel="noopener" class="github-star-pill" aria-label="Star pyhusk on GitHub">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
      </svg>
      <span>Star on GitHub</span>
    </a>
  </div>
</div>
{{ super() }}
{% endblock %}
